name: byelui
description: A daily expense tracker for you and your family
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # UI & Animations
  fl_chart: 1.0.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  flutter_animate: ^4.5.0

  # Photo capture (new for ByeLui)
  image_picker: ^1.1.2

  # Utilities
  url_launcher: ^6.1.12
  intl: any
  uuid: ^4.2.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  permission_handler: 12.0.1
  flutter_launcher_icons: ^0.13.1
  table_calendar: ^3.0.9
  local_auth: ^2.1.8
  http: any
  package_info_plus: 8.3.0
  device_info_plus: 11.5.0

  # Notifications
  flutter_local_notifications: ^19.4.0
  timezone: 0.10.1

  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  google_mobile_ads: any
  csv: any
  pdf: any
  share_plus: any
  file_picker: any

  # Localization
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

  # Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
